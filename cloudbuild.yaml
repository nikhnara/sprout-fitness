# Trigger this config on pushes to ^main$ only, using gamna-666's service account.
# Google Cloud fetches this repository; no GCP credentials are stored in GitHub.
steps:
  - id: validate-config
    name: python:3.12-slim
    entrypoint: python
    args: [scripts/cloud_deploy.py, validate]
    env: &deployment_env
      - 'PROJECT_ID=$PROJECT_ID'
      - 'REGION=${_REGION}'
      - 'BUCKET_NAME=${_BUCKET_NAME}'
      - 'OWNER_EMAIL=${_OWNER_EMAIL}'
      - 'FIREBASE_CONFIG=${_FIREBASE_CONFIG}'
      - 'FRONTEND_ORIGIN=${_FRONTEND_ORIGIN}'
      - 'IMAGE_URI=${_REGION}-docker.pkg.dev/$PROJECT_ID/sprout/api:$COMMIT_SHA'
      - 'DEPLOY_BRANCH=$BRANCH_NAME'
  - id: frontend-checks
    name: node:22-slim
    entrypoint: bash
    args: ['-ceu', 'node --check dist/app.js; node --test tests/*.test.mjs']
  - id: backend-checks
    name: python:3.12-slim
    entrypoint: python
    args: ['-m', unittest, discover, '-s', tests, '-p', 'test_*.py']
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args: [build, '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/sprout/api:$COMMIT_SHA', server]
  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/sprout/api:$COMMIT_SHA']
  - id: build-web
    name: gcr.io/cloud-builders/docker
    args: [build, '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/sprout/web:$COMMIT_SHA', web]
  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/sprout/web:$COMMIT_SHA']
  - id: deploy-api-and-ui
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: python3
    args: [scripts/cloud_deploy.py, deploy]
    env: *deployment_env
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/sprout/web:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/sprout/api:$COMMIT_SHA'
substitutions:
  _REGION: us-central1
  _BUCKET_NAME: ''
  _OWNER_EMAIL: ''
  _FIREBASE_CONFIG: '{"apiKey":"AIzaSyD79ynFHeN03sBz_3zOB9WrgevcPETiLbc","authDomain":"sprout-fitness-1eb7f.firebaseapp.com","projectId":"sprout-fitness-1eb7f","storageBucket":"sprout-fitness-1eb7f.firebasestorage.app","messagingSenderId":"316782184589","appId":"1:316782184589:web:08fd948e6859066e81bac4","measurementId":"G-PVF0VJPMNY"}'
  _FRONTEND_ORIGIN: 'https://gamna.app'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
